<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGD ERP - Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

    <div class="login-card fade-in">
        <div class="login-left">
            <div class="login-branding">
                <h1><i class="bi bi-box-seam me-2"></i>SGD ERP</h1>
                <p>Inventory Management System</p>
                <div class="mt-4" style="opacity: 0.8; font-size: 14px;">
                    <p><i class="bi bi-check-circle me-2"></i> Wallpaper & Interior Decoration</p>
                    <p><i class="bi bi-check-circle me-2"></i> Sales & Purchase Tracking</p>
                    <p><i class="bi bi-check-circle me-2"></i> Financial Analytics</p>
                </div>
            </div>
        </div>
        <div class="login-right">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-login w-100 mb-3" id="loginBtn">
                    <span id="btnText">Login</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
                
                <div id="loginAlert" class="alert alert-danger d-none" role="alert">
                    Invalid username or password.
                </div>
                
                <div class="text-center mt-3 text-muted" style="font-size: 12px;">
                    <p>Demo Mode: admin / admin123</p>
                    &copy; 2026 SGD. All rights reserved.
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth JS -->
    <script src="js/auth.js"></script>
</body>
</html>
